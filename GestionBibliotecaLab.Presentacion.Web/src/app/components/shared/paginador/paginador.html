<div class="paginador" role="navigation" aria-label="Paginación">
    <button type="button" class="btn btn--outline-primary btn--sm" (click)="anterior()"
        [disabled]="paginaActual() <= 1">
        <app-icon name="fizquierda" [size]="14" /> Anterior
    </button>
    <span class="paginador__info">Página {{ paginaActual() }} de {{ totalPaginas() }}</span>
    <button type="button" class="btn btn--outline-primary btn--sm" (click)="siguiente()"
        [disabled]="paginaActual() >= totalPaginas()">
        Siguiente <app-icon name="fderecha" [size]="14" />
    </button>
</div>
