<div class="cover-imagen" [class]="'cover-imagen--' + tamanio()">
    @if (url(); as src) {
    <img [src]="src" [alt]="'Portada de ' + titulo()" loading="lazy" (error)="onError()" class="cover-imagen__img" />
    } @else {
    <div class="cover-imagen__placeholder" [attr.title]="titulo()">
        <span class="cover-imagen__iniciales">{{ iniciales() }}</span>
    </div>
    }
</div>
