@if (visible()) {
<div class="modal-overlay" (click)="cerrar.emit()">
    <div class="modal" [class]="'modal--' + tamano()" role="dialog" aria-modal="true" (click)="$event.stopPropagation()">
        @if (titulo()) {
        <h2 class="modal__titulo">{{ titulo() }}</h2>
        }
        <ng-content />
    </div>
</div>
}
