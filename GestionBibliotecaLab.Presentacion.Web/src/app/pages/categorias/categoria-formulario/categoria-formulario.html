<form class="categoria-formulario" [formGroup]="formulario" (ngSubmit)="guardar()" novalidate>
    <div class="form-group">
        <label class="form-label" for="nombre">Nombre</label>
        <input id="nombre" type="text" class="form-control" formControlName="nombre" />
        @if (controles.nombre.invalid && controles.nombre.touched) {
        <span class="form-error">El nombre es requerido (máx. 100 caracteres).</span>
        }
    </div>

    <div class="form-group">
        <label class="form-label" for="descripcion">Descripción</label>
        <textarea id="descripcion" class="form-control" rows="3" formControlName="descripcion"></textarea>
        @if (controles.descripcion.invalid && controles.descripcion.touched) {
        <span class="form-error">La descripción admite máximo 300 caracteres.</span>
        }
    </div>

    @if (errorServidor()) {
    <div class="form-error--bloque" role="alert">{{ errorServidor() }}</div>
    }

    <div class="categoria-formulario__acciones">
        <button type="button" class="btn btn--outline-primary btn--sm" (click)="cancelado.emit()">Cancelar</button>
        <button type="submit" class="btn btn--primary btn--sm" [disabled]="guardando()">
            {{ guardando() ? 'Guardando…' : modoEdicion() ? 'Guardar cambios' : 'Registrar categoría' }}
        </button>
    </div>
</form>
