<section class="page">
    <app-page-header eyebrow="Mi actividad" titulo="Mis reservas"
        subtitulo="Consulta el estado de tus reservas de laboratorio" />

    <form [formGroup]="filtrosForm" novalidate class="filtros__campo mis-reservas__filtro">
        <label class="form-label" for="f-estado">Estado</label>
        <select id="f-estado" class="form-control" formControlName="estado">
            <option value="">Todos</option>
            <option value="Pendiente">Pendiente</option>
            <option value="Confirmada">Confirmada</option>
            <option value="Cancelada">Cancelada</option>
            <option value="Finalizada">Finalizada</option>
        </select>
    </form>

    @if (cargando()) {
    <p class="page__estado">Cargando tus reservas...</p>
    } @else if (reservas().length === 0) {
    <app-empty-state icono="reservas" titulo="No tienes reservas registradas"
        texto="Aquí verás tus reservas de laboratorio una vez que un bibliotecario registre una a tu nombre." />
    } @else {
    <div class="mis-reservas__lista">
        @for (r of reservas(); track r.id) {
        <app-reserva-item [reserva]="r" [mostrarUsuario]="false" [mostrarAccionConfirmar]="false"
            (cancelar)="solicitarCancelacion(r)" />
        }
    </div>
    <app-paginador [total]="totalRegistros()" [tamanioPagina]="tamanioPagina" [(paginaActual)]="paginaActual" />
    }
</section>

<app-confirm-modal [visible]="!!reservaParaCancelar()" titulo="Cancelar reserva"
    [mensaje]="'¿Confirmas cancelar tu reserva de &quot;' + (reservaParaCancelar()?.nombreLaboratorio ?? '') + '&quot;?'"
    textoConfirmar="Cancelar reserva" (confirmar)="confirmarCancelacion()" (cancelar)="cancelarSolicitud()" />
