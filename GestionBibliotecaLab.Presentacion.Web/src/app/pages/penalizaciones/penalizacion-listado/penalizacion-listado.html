<section class="page">
    <app-page-header eyebrow="Circulación" titulo="Gestión de Penalizaciones"
        subtitulo="Registra, resuelve y anula penalizaciones de préstamos y reservas">
        <button actions type="button" class="btn btn--primary" (click)="abrirNuevo()">
            <app-icon name="nuevo" [size]="15" /> Registrar penalización
        </button>
    </app-page-header>

    <form class="surface filter-toolbar" [formGroup]="filtrosForm" novalidate>
        <div class="filter-toolbar__main">
            <div class="filter-toolbar__busqueda">
                <span class="filter-toolbar__icon"><app-icon name="buscar" [size]="16" /></span>
                <input type="text" class="form-control" formControlName="buscarUsuario"
                    placeholder="Buscar por usuario..." />
            </div>

            <button type="button" class="btn" 
                [class.btn--primary]="filtrosAvanzados()" 
                [class.btn--outline-primary]="!filtrosAvanzados()"
                (click)="toggleFiltros()">
                <app-icon name="buscar" [size]="15" />
                {{ filtrosAvanzados() ? 'Ocultar filtros' : 'Filtros avanzados' }}
            </button>
        </div>

        @if (filtrosAvanzados()) {
        <div class="filter-toolbar__advanced">
            <div class="filtros__campo">
                <label class="form-label" for="f-origen">Origen</label>
                <select id="f-origen" class="form-control" formControlName="origen">
                    <option value="">Todos</option>
                    <option value="Prestamo">Préstamo</option>
                    <option value="ReservaLab">Reserva de laboratorio</option>
                </select>
            </div>

            <div class="filtros__campo">
                <label class="form-label" for="f-tipo">Tipo</label>
                <select id="f-tipo" class="form-control" formControlName="tipo">
                    <option value="">Todos</option>
                    @for (tipo of todosLosTipos; track tipo) {
                    <option [value]="tipo">{{ etiquetasTipo[tipo] }}</option>
                    }
                </select>
            </div>

            <div class="filtros__campo">
                <label class="form-label" for="f-estado">Estado</label>
                <select id="f-estado" class="form-control" formControlName="estado">
                    <option value="">Todos</option>
                    <option value="Pendiente">Pendiente</option>
                    <option value="Pagada">Pagada</option>
                    <option value="Anulada">Anulada</option>
                </select>
            </div>

            <div class="filter-toolbar__acciones">
                <button type="button" class="btn btn--outline-primary btn--sm filter-toolbar__limpiar"
                    (click)="limpiarFiltros()">
                    Limpiar
                </button>
            </div>
        </div>
        }
    </form>

    @if (cargando()) {
    <p class="page__estado">Cargando penalizaciones...</p>
    } @else if (penalizaciones().length === 0) {
    <app-empty-state icono="penalizaciones" titulo="No se encontraron penalizaciones"
        texto="Prueba modificando los filtros de búsqueda." />
    } @else {
    <div class="penalizacion-listado__lista">
        @for (p of penalizaciones(); track p.id) {
        <app-penalizacion-item [penalizacion]="p" [mostrarUsuario]="true" (resolver)="solicitarResolucion(p)"
            (anular)="solicitarAnulacion(p)" />
        }
    </div>
    <app-paginador [total]="totalRegistros()" [tamanioPagina]="tamanioPagina" [(paginaActual)]="paginaActual" />
    }
</section>

<app-modal-shell 
    [visible]="modalFormularioAbierto()" 
    tamano="lg" 
    titulo="Registrar penalización"
    (cerrar)="cerrarFormulario()">
    @if (modalFormularioAbierto()) {
    <app-penalizacion-formulario 
        (guardado)="onGuardado()" 
        (cerrar)="cerrarFormulario()" />
    }
</app-modal-shell>

<app-confirm-modal 
    [visible]="!!penalizacionParaResolver()" 
    titulo="Marcar como pagada"
    mensaje="¿Confirmas que esta penalización fue pagada? Esta acción no se puede deshacer."
    textoConfirmar="Marcar como pagada" 
    (confirmar)="confirmarResolucion()"
    (cancelar)="cancelarSolicitudResolucion()" />

<app-confirm-modal 
    [visible]="!!penalizacionParaAnular()" titulo="Anular penalización"
    mensaje="¿Confirmas anular esta penalización? Esta acción no se puede deshacer." 
    textoConfirmar="Anular"
    (confirmar)="confirmarAnulacion()" 
    (cancelar)="cancelarSolicitudAnulacion()" />
