<div class="searchbox">
    <div class="searchbox__campo">
        <span class="searchbox__icono"><app-icon name="buscar" [size]="15" /></span>
        <input type="text" class="form-control" [formControl]="control"
            placeholder="Busca por nombre, apellido o email del usuario..." autocomplete="off" />
    </div>

    @if (buscando()) {
    <div class="searchbox__resultados surface">
        <p class="searchbox__mensaje">Buscando reservas…</p>
    </div>
    } @else if (seHaBuscado() && resultados().length === 0) {
    <div class="searchbox__resultados surface">
        <p class="searchbox__mensaje">No se encontraron reservas confirmadas o finalizadas para ese usuario.</p>
    </div>
    } @else if (resultados().length > 0) {
    <div class="searchbox__resultados surface">
        @for (r of resultados(); track r.id) {
        <button type="button" class="searchbox__item" (click)="seleccionar(r)">
            <span class="searchbox__item-info">
                <strong>{{ r.nombreLaboratorio }}</strong>
                <span>{{ r.nombreUsuario }} · {{ r.emailUsuario }}</span>
                <span>Reserva #{{ r.id }} · {{ r.fecha | date:'dd/MM/yyyy' }} · {{ r.estado }}</span>
            </span>
        </button>
        }
    </div>
    }
</div>
