<div class="searchbox">
    <div class="searchbox__campo">
        <span class="searchbox__icono"><app-icon name="buscar" [size]="15" /></span>
        <input type="text" class="form-control" [formControl]="control" placeholder="Busca un laboratorio por nombre..."
            autocomplete="off" />
    </div>

    @if (buscando()) {
    <div class="searchbox__resultados surface">
        <p class="searchbox__mensaje">Buscando laboratorios…</p>
    </div>
    } @else if (seHaBuscado() && resultados().length === 0) {
    <div class="searchbox__resultados surface">
        <p class="searchbox__mensaje">No se encontraron laboratorios disponibles con ese nombre.</p>
    </div>
    } @else if (resultados().length > 0) {
    <div class="searchbox__resultados surface">
        @for (l of resultados(); track l.id) {
        <button type="button" class="searchbox__item" (click)="seleccionar(l)">
            <span class="searchbox__item-media">
                <app-cover-imagen [portada]="l.imagen" [titulo]="l.nombre" tamanio="sm" aspectRatio="4 / 3" />
            </span>
            <span class="searchbox__item-info">
                <strong>{{ l.nombre }}</strong>
                <span>{{ l.ubicacion }} · Capacidad {{ l.capacidad }}</span>
            </span>
        </button>
        }
    </div>
    }
</div>
