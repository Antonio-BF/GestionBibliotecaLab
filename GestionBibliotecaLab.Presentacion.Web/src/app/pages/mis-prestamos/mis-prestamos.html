<section class="page">
    <app-page-header eyebrow="Mi actividad" titulo="Mis préstamos"
        subtitulo="Consulta tus libros prestados, vigentes y vencidos" />

    <div class="surface mis-prestamos__resumen">
        <span class="badge badge--activo">{{ resumen().vigentes }} vigente(s) en esta página</span>
        @if (resumen().vencidos > 0) {
        <span class="badge badge--vencido">{{ resumen().vencidos }} vencido(s) en esta página</span>
        }
        <form [formGroup]="filtrosForm" novalidate class="filtros__campo mis-prestamos__filtro">
            <label class="form-label" for="f-estado">Estado</label>
            <select id="f-estado" class="form-control" formControlName="estado">
                <option value="">Todos</option>
                <option value="Prestado">Prestado</option>
                <option value="EnMora">En mora</option>
                <option value="Devuelto">Devuelto</option>
            </select>
        </form>
    </div>

    @if (cargando()) {
    <p class="page__estado">Cargando tus préstamos...</p>
    } @else if (prestamos().length === 0) {
    <app-empty-state icono="prestamos" titulo="No tienes préstamos registrados"
        texto="Aquí verás los libros prestados a tu nombre una vez que un bibliotecario registre un préstamo." />
    } @else {
    <div class="mis-prestamos__lista">
        @for (p of prestamos(); track p.id) {
        <app-prestamo-item [prestamo]="p" [mostrarUsuario]="false" [mostrarAcciones]="false" />
        }
    </div>
    <app-paginador [total]="totalRegistros()" [tamanioPagina]="tamanioPagina" [(paginaActual)]="paginaActual" />
    }
</section>
