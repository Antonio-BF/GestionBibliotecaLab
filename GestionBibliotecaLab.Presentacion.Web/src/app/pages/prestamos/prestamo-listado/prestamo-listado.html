<section class="page">
  <app-page-header eyebrow="Circulación" titulo="Gestión de Préstamos"
    subtitulo="Registra, renueva y controla las devoluciones de libros">
    <button actions type="button" class="btn btn--primary" (click)="abrirNuevo()">
      <app-icon name="nuevo" [size]="15" /> Registrar préstamo
    </button>
  </app-page-header>

  <form class="surface filter-toolbar" [formGroup]="filtrosForm" novalidate>
    <div class="filter-toolbar__main">
        <div class="filter-toolbar__busqueda">
            <span class="filter-toolbar__icon"><app-icon name="buscar" [size]="16" /></span>
            <input type="text" class="form-control" formControlName="buscarUsuario" placeholder="Buscar por usuario..." />
        </div>

        <button type="button" class="btn" 
            [class.btn--primary]="filtrosAvanzados()" 
            [class.btn--outline-primary]="!filtrosAvanzados()"
            (click)="toggleFiltros()">
            <app-icon name="buscar" [size]="15" />
            {{ filtrosAvanzados() ? 'Ocultar filtros' : 'Filtros avanzados' }}
        </button>
    </div>

    @if (filtrosAvanzados()) {
    <div class="filter-toolbar__advanced">
        <div class="filtros__campo">
            <label class="form-label" for="f-libro">Libro</label>
            <input id="f-libro" type="text" class="form-control" formControlName="buscarLibro" placeholder="Título o ISBN" />
        </div>

        <div class="filtros__campo">
            <label class="form-label" for="f-estado">Estado</label>
            <select id="f-estado" class="form-control" formControlName="estado">
                <option value="">Todos</option>
                <option value="Prestado">Prestado</option>
                <option value="EnMora">En mora</option>
                <option value="Devuelto">Devuelto</option>
            </select>
        </div>

        <div class="filter-toolbar__acciones">
            <button type="button" class="btn btn--outline-primary btn--sm filter-toolbar__limpiar" (click)="limpiarFiltros()">
                Limpiar
            </button>
        </div>
    </div>
    }
  </form>

  @if (cargando()) {
  <p class="page__estado">Cargando préstamos...</p>
  } @else if (prestamos().length === 0) {
  <app-empty-state icono="prestamos" titulo="No se encontraron préstamos"
    texto="Prueba modificando los filtros de búsqueda." />
  } @else {
  <div class="prestamo-listado__lista">
    @for (p of prestamos(); track p.id) {
    <app-prestamo-item [prestamo]="p" [mostrarUsuario]="true" [mostrarAcciones]="true"
      (renovar)="solicitarRenovacion(p)" (devolver)="solicitarDevolucion(p)" />
    }
  </div>
  <app-paginador [total]="totalRegistros()" [tamanioPagina]="tamanioPagina" [(paginaActual)]="paginaActual" />
  }
</section>

<app-modal-shell [visible]="modalFormularioAbierto()" tamano="lg" titulo="Registrar préstamo"
  (cerrar)="cerrarFormulario()">
  @if (modalFormularioAbierto()) {
  <app-prestamo-formulario (guardado)="onGuardado()" (cerrar)="cerrarFormulario()" />
  }
</app-modal-shell>

<app-modal-shell 
  [visible]="!!prestamoParaRenovar()" 
  tamano="md" titulo="Renovar préstamo"
  (cerrar)="cerrarRenovacion()">
  @if (prestamoParaRenovar(); as p) {
  <app-prestamo-renovacion [prestamo]="p" 
  (guardado)="onGuardado()" 
  (cerrar)="cerrarRenovacion()" />
  }
</app-modal-shell>

<app-confirm-modal 
  [visible]="!!prestamoParaDevolver()" 
  titulo="Registrar devolución" 
  [mensaje]="mensajeDevolucion()"
  textoConfirmar="Confirmar devolución" 
  (confirmar)="confirmarDevolucion()" 
  (cancelar)="cancelarDevolucion()" />
